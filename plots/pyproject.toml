[project]
name = "t2-plots"
version = "0.1.0"
description = "Figures of the report, from the CSV files written by cmd/analyze"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.9", "pandas>=2.2"]

[project.scripts]
plots = "t2_plots:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2_plots"]
